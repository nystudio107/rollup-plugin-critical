checks:
  javascript: true
build:
  image: default-jammy
  environment:
    node: v22
  nodes:
    analysis:
      tests:
        override:
          - js-scrutinizer-run
    tests: true
    coverage:
      tests:
        override:
          - command: 'npm run test'
            coverage:
              file: 'coverage/clover.xml'
              format: 'clover'
